        <button class="card-play" id="dos-c-play" onclick="toggleCard('dos')" aria-label="Play DOS"><svg viewBox="0 0 10 10"><polygon id="dos-c-icon" points="2,1 9,5 2,9"></polygon></svg></button>
        <div class="card-wave" id="dos-c-wave"><i></i><i></i><i></i><i></i><i></i></div>

<script>
/* ── I18N (EN / ES) ── */
const I18N = {
  en: {
    donate: 'DONATE ♥',
    enter: 'ENTER THE STATION →',
    scroll: 'SCROLL',
    connecting: 'CONNECTING…',
    reconnecting: 'RECONNECTING…',
    statusIdle: 'EVERY SAT · LIVE ON MIXCLOUD 7PM',
    statusLive: 'ON AIR NOW · LIVE ON MIXCLOUD'
  },
  es: {
    donate: 'DONAR ♥',
    enter: 'ENTRAR A LA ESTACIÓN →',
    scroll: 'DESLIZA',
    connecting: 'CONECTANDO…',
    reconnecting: 'RECONECTANDO…',
    statusIdle: 'CADA SÁB · EN VIVO EN MIXCLOUD 7PM',
    statusLive: 'AL AIRE AHORA · EN VIVO EN MIXCLOUD'
  }
};
let LANG = (localStorage.getItem('sx-lang') === 'es') ? 'es' : 'en';
function tr(key){ return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key]; }
function setLang(l){
  LANG = (l === 'es') ? 'es' : 'en';
  localStorage.setItem('sx-lang', LANG);
  document.documentElement.lang = LANG;
  applyLang();
}
function applyLang(){
  document.getElementById('tb-donate').textContent = tr('donate');
  document.getElementById('enter-btn').textContent = tr('enter');
  document.getElementById('scroll-hint').textContent = tr('scroll');
  // now-playing placeholders (only replace if still showing a placeholder)
  ['uno','dos'].forEach(ch=>{
    const el = document.getElementById(ch+'-c-now');
    if(el && el.dataset.placeholder === '1') el.textContent = tr('connecting');
  });
  if(typeof updateStatus === 'function') updateStatus();
}

/* ── CURSOR ── */
const cur = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
let mx = window.innerWidth/2, my = window.innerHeight/2;
let rx = mx, ry = my;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; cur.style.left = mx+'px'; cur.style.top = my+'px'; });
(function lerpCursor(){ rx += (mx-rx)*.12; ry += (my-ry)*.12; ring.style.left = rx+'px'; ring.style.top = ry+'px'; requestAnimationFrame(lerpCursor); })();

/* ── BOTH CHANNEL PLAYERS (UNO + DOS) ── real AzuraCast streams + now-playing ── */
const STREAMS = {
  uno: 'https://stream.selexiones.com/listen/uno/radio.mp3',
  dos: 'https://stream.selexiones.com/listen/dos/radio.mp3'
};
const NOWPLAYING = {
  uno: 'https://stream.selexiones.com/api/nowplaying/uno',
  dos: 'https://stream.selexiones.com/api/nowplaying/dos'
};
const cardState = { uno:{playing:false,vol:0.7}, dos:{playing:false,vol:0.7} };
const audios = {};

['uno','dos'].forEach(ch => {
  const a = new Audio();
  a.preload = 'none';
  a.volume = cardState[ch].vol;
  a.addEventListener('playing', () => { reflect(ch, true); });
  a.addEventListener('pause',   () => reflect(ch, false));
  a.addEventListener('error',   () => { reflect(ch, false); setLoading(ch, false); scheduleReconnect(ch, 2000); });
  a.addEventListener('ended',   () => { if(cardState[ch].wantPlay) scheduleReconnect(ch, 500); });
  audios[ch] = a;
  document.getElementById(ch+'-c-vol').style.width = (cardState[ch].vol*100)+'%';
});
const stallTimers = {};
function clearStallTimer(ch){ if(stallTimers[ch]){ clearTimeout(stallTimers[ch]); stallTimers[ch] = null; } }
function scheduleReconnect(ch, delay){
  if(!cardState[ch].wantPlay) return;
  clearStallTimer(ch);
  stallTimers[ch] = setTimeout(()=>{ stallTimers[ch] = null; if(cardState[ch].wantPlay) reconnect(ch); }, delay);
}
function reconnect(ch){
  const a = audios[ch];
  if(!a || !cardState[ch].wantPlay) return;
  // surface a visible reconnecting state so a flaky server reads as "buffering", not "broken"
  setLoading(ch, true);
  const nowEl = document.getElementById(ch+'-c-now');
  if(nowEl){ nowEl.dataset.placeholder = '1'; nowEl.textContent = tr('reconnecting'); }
  try { a.src = STREAMS[ch] + '?_=' + Date.now(); a.play().catch(()=>{}); } catch(e){}
}
/* progress-based watchdog: only reconnect if playback is TRULY frozen ~12s.
   iOS fires waiting/stalled constantly during healthy playback, so we watch time progress, not events. */
setInterval(()=>{
  ['uno','dos'].forEach(ch=>{
    const a = audios[ch];
    if(!cardState[ch].wantPlay || a.paused){ a.__frozen = 0; return; }
    const ct = a.currentTime;
    if(a.__lastCt !== undefined && Math.abs(ct - a.__lastCt) < 0.05){
      a.__frozen = (a.__frozen||0) + 1;
      if(a.__frozen >= 12){ a.__frozen = 0; reconnect(ch); }
    } else { a.__frozen = 0; }
    a.__lastCt = ct;
  });
}, 1000);

function setLoading(ch, on){
  const btn = document.getElementById(ch+'-c-play');
  if (btn) btn.classList.toggle('loading', on);
}
function reflect(ch, playing){
  cardState[ch].playing = playing;
  if (playing) setLoading(ch, false);
  const svg = document.getElementById(ch+'-c-play').querySelector('svg');
  if (svg) svg.innerHTML = playing
    ? '<rect x="2" y="1" width="2.4" height="8"></rect><rect x="5.6" y="1" width="2.4" height="8"></rect>'
    : '<polygon points="2,1 9,5 2,9"></polygon>';
  document.getElementById(ch+'-c-wave').classList.toggle('on', playing);
}

function toggleCard(ch){
  const a = audios[ch];
  if (cardState[ch].playing) {
    cardState[ch].wantPlay = false;
    clearStallTimer(ch);
    a.pause();
  } else {
    // only one channel plays at a time
    Object.keys(audios).forEach(o => { if (o !== ch){ cardState[o].wantPlay = false; clearStallTimer(o); audios[o].pause(); } });
    cardState[ch].wantPlay = true;
    setLoading(ch, true);
    a.src = STREAMS[ch] + '?_=' + Date.now();
    a.play().catch(() => setLoading(ch, false));
  }
}

/* ── HAND OFF PLAYBACK TO THE STATION PAGE ── persist the live channel so it keeps playing after ENTER ── */
window.addEventListener('pagehide', () => {
  const active = Object.keys(cardState).find(ch => cardState[ch].playing);
  try {
    localStorage.setItem('sx-playback', JSON.stringify({
      ch: active || null,
      vol: active ? cardState[active].vol : null,
      ts: Date.now()
    }));
  } catch (e) {}
});

function setCardVol(ch, clientX){
  const bar = document.getElementById(ch+'-c-volbar');
  const rect = bar.getBoundingClientRect();
  const v = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  cardState[ch].vol = v;
  document.getElementById(ch+'-c-vol').style.width = (v*100)+'%';
  audios[ch].volume = v;
}
['uno','dos'].forEach(ch => {
  const bar = document.getElementById(ch+'-c-volbar');
  if (!bar) return;
  let dragging = false;
  const move = e => { if (dragging) { setCardVol(ch, e.clientX); e.preventDefault(); } };
  const up = () => { dragging = false; window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  bar.addEventListener('pointerdown', e => {
    dragging = true;
    setCardVol(ch, e.clientX);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    e.preventDefault();
  });
});

/* poll now-playing per channel → ARTIST — TITLE */
function startNowPlaying(ch){
  const nowEl = document.getElementById(ch+'-c-now');
  nowEl.dataset.placeholder = '1';
  const fallback = 'SELEXIONES ' + ch.toUpperCase();
  let firstLoad = true;
  async function pull(){
    try{
      const res = await fetch(NOWPLAYING[ch], { cache:'no-store' });
      if(!res.ok) return;
      const data = await res.json();
      const song = data && data.now_playing && data.now_playing.song;
      if(!song) return;
      const artist = (song.artist || 'SELEXIONES').trim();
      const title  = (song.title  || '').trim();
      nowEl.dataset.placeholder = '0';
      nowEl.textContent = (title ? (artist + ' — ' + title) : artist).toUpperCase();
    }catch(err){
      if(firstLoad) nowEl.textContent = fallback;
    } finally { firstLoad = false; }
  }
  pull();
  setInterval(pull, 17000);
}
startNowPlaying('uno');
startNowPlaying('dos');

document.querySelectorAll('a,.enter-btn,.ch-card,.card-play,.card-vol').forEach(el=>{
  el.addEventListener('mouseenter',()=>{ ring.style.width='52px'; ring.style.height='52px'; ring.style.borderColor='rgba(224,64,160,.6)'; });
  el.addEventListener('mouseleave',()=>{ ring.style.width='32px'; ring.style.height='32px'; ring.style.borderColor='rgba(224,64,160,.3)'; });
});

/* ── CANVAS PARTICLE FIELD ── */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
const LOW = window.matchMedia('(max-width:768px)').matches || (navigator.hardwareConcurrency||8) <= 4;
if(LOW || window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('lite');
const PARTICLE_COUNT = LOW ? 44 : 120;
const DRAW_LINES = !LOW;
const FRAME_MS = LOW ? 33 : 0;
const GLOW = document.createElement('canvas'); GLOW.width = GLOW.height = 64;
(function(){ const g = GLOW.getContext('2d'); const rg = g.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,'rgba(240,120,220,.30)'); rg.addColorStop(1,'rgba(240,120,220,0)');
  g.fillStyle = rg; g.fillRect(0,0,64,64); })();
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
class Particle {
  constructor(){ this.reset(true); }
  reset(init){
    this.x = Math.random()*W;
    this.y = init ? Math.random()*H : (Math.random()>.5 ? -10 : H+10);
    this.size = Math.random()*1.5+.3;
    this.speedX = (Math.random()-0.5)*.4;
    this.speedY = (Math.random()-.7)*.3;
    this.life = 0; this.maxLife = 200 + Math.random()*400;
    this.hue = Math.random()>.5 ? 300+Math.random()*40 : 270+Math.random()*30;
    this.sat = 60+Math.random()*40; this.brightness = 55+Math.random()*30; this.alpha = 0;
  }
  update(){
    this.speedX += (Math.random()-.5)*.02; this.speedY += (Math.random()-.5)*.02;
    this.speedX *= .98; this.speedY *= .98;
    const dx = this.x-mx, dy = this.y-my, dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < 120){ const f=(120-dist)/120; this.speedX += (dx/dist)*f*.8; this.speedY += (dy/dist)*f*.8; }
    this.x += this.speedX; this.y += this.speedY; this.life++;
    const lr = this.life/this.maxLife;
    if(lr<.1) this.alpha = lr/.1; else if(lr>.8) this.alpha = 1-(lr-.8)/.2; else this.alpha = 1;
    if(this.life>this.maxLife || this.x<-20 || this.x>W+20 || this.y<-20 || this.y>H+20) this.reset(false);
  }
  draw(){
    const s = this.size, gr = s*6;
    ctx.globalAlpha = this.alpha*.5;
    ctx.drawImage(GLOW, this.x-gr, this.y-gr, gr*2, gr*2);
    ctx.globalAlpha = this.alpha*.95;
    ctx.fillStyle = 'hsl('+this.hue+','+this.sat+'%,'+this.brightness+'%)';
    ctx.beginPath(); ctx.arc(this.x,this.y,s,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
for(let i=0;i<PARTICLE_COUNT;i++) particles.push(new Particle());
const trail = []; const TRAIL_LEN = 28;
const freqEl = document.getElementById('freq');
const BAR_COUNT = LOW ? 32 : 80;
for(let i=0;i<BAR_COUNT;i++){ const b=document.createElement('div'); b.className='fbar'; if(LOW) b.style.background = (i/BAR_COUNT) < .5 ? 'rgba(255,113,206,.28)' : 'rgba(185,103,255,.28)'; freqEl.appendChild(b); }
const fbars = freqEl.querySelectorAll('.fbar');
let t = 0; let lastT = 0;
function draw(ts){
  requestAnimationFrame(draw);
  if(document.hidden) return;
  if(FRAME_MS && ts && ts - lastT < FRAME_MS) return;
  lastT = ts || 0;
  t++;
  const FLASH_PERIOD = 430; const fp = t % FLASH_PERIOD;
  const flashRaw = Math.max(0, 1 - fp/52); const flash = flashRaw*flashRaw;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#130b22'; ctx.fillRect(0,0,W,H);
  const vig = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  vig.addColorStop(0,'transparent'); vig.addColorStop(.7,'transparent'); vig.addColorStop(1,'rgba(5,2,12,.28)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
  const spot = ctx.createRadialGradient(mx,my,0,mx,my,320);
  spot.addColorStop(0,'rgba(185,103,255,.16)'); spot.addColorStop(.4,'rgba(255,113,206,.09)'); spot.addColorStop(1,'transparent');
  ctx.fillStyle=spot; ctx.fillRect(0,0,W,H);
  trail.push({x:mx,y:my}); if(trail.length>TRAIL_LEN) trail.shift();
  for(let i=0;i<trail.length-1;i++){
    const a=(i/trail.length)*.25, p=trail[i], n=trail[i+1];
    ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle='rgba(240,96,192,.6)'; ctx.lineWidth=(i/trail.length)*2;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(n.x,n.y); ctx.stroke(); ctx.restore();
  }
  if(DRAW_LINES){
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y, d=Math.sqrt(dx*dx+dy*dy);
      const CONN = 90 + flash*70;
      if(d<CONN){
        ctx.save(); ctx.globalAlpha=(1-d/CONN)*(.08 + flash*.6);
        ctx.strokeStyle = flash>.05 ? 'rgba(255,113,206,.8)' : 'rgba(220,100,255,.8)'; ctx.lineWidth=.5 + flash*.9;
        ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.stroke(); ctx.restore();
      }
    }
  }
  }
  particles.forEach(p=>{ p.update(); p.draw(); });
  fbars.forEach((b,i)=>{
    const wave = Math.sin(t*.03 + i*.18) * Math.cos(t*.02 + i*.09);
    const rand = Math.sin(t*.11 + i*.3) * .5 + .5;
    const h = Math.max(2, (wave*.5+.5) * rand * 36 + 2);
    b.style.height = h+'px';
    if(!LOW) b.style.background = (i/BAR_COUNT) < .5 ? 'rgba(255,113,206,'+(h/40*.5)+')' : 'rgba(185,103,255,'+(h/40*.5)+')';
  });
}
draw();

/* ── ENTRANCE ── */
function animate(el, props, delay){
  return new Promise(res=>{ setTimeout(()=>{ el.style.transition='opacity .8s ease, transform .8s ease'; Object.assign(el.style, props); setTimeout(res, 800); }, delay); });
}
setTimeout(async ()=>{
  const tb = document.getElementById('topbar'); tb.style.transition='opacity 1s ease'; tb.style.opacity='1';
  await animate(document.getElementById('channels'),{opacity:'1',transform:'translateY(0)'},200);
  await animate(document.getElementById('wordmark'),{opacity:'1',transform:'translateY(0)'},0);
  await animate(document.getElementById('divider'),{opacity:'1'},0);
  await animate(document.getElementById('enter-langs'),{opacity:'1'},100);
  const sh = document.getElementById('scroll-hint'); sh.style.transition='opacity 1s ease'; sh.style.opacity='1';
  const freq = document.getElementById('freq'); freq.style.transition='opacity 1.5s ease'; freq.style.opacity='1';
}, 400);

/* wordmark glitch + parallax */
const wm = document.getElementById('wordmark');
let glitchTimeout;
wm.addEventListener('mouseenter',()=>{
  clearTimeout(glitchTimeout); let count=0; const chars='SELEXIONES'.split('');
  const glitch = setInterval(()=>{ count++; if(count>8){clearInterval(glitch); wm.textContent='SELEXIONES'; return;} wm.textContent = chars.map(c=> Math.random()>.6 ? '█▓▒░X▄'[Math.floor(Math.random()*7)] : c).join(''); },60);
  glitchTimeout = setTimeout(()=>{ clearInterval(glitch); wm.textContent='SELEXIONES'; },600);
});
wm.addEventListener('mouseleave',()=>{ clearTimeout(glitchTimeout); wm.textContent='SELEXIONES'; });
document.addEventListener('mousemove',e=>{ const px=(e.clientX/W-.5), py=(e.clientY/H-.5); wm.style.transform='translateY(0) translate('+(px*8)+'px,'+(py*4)+'px)'; });

/* ── LIVE STATUS BADGE ── */
let updateStatus;
(function () {
  const el = document.getElementById('tb-status');
  const txt = document.getElementById('tb-status-text');
  if (!el || !txt) return;
  function isLive(d){ const day=d.getDay(), h=d.getHours(); return (day===6 && h>=19) || (day===0 && h<2); }
  updateStatus = function(){
    if (isLive(new Date())) { el.classList.add('live'); txt.textContent=tr('statusLive'); }
    else { el.classList.remove('live'); txt.textContent=tr('statusIdle'); }
  };
  updateStatus(); setInterval(updateStatus, 30000);
})();

applyLang();
</script>
